name: Deploy to GitHub Pages

# Runs on every push to `main` (the repo's default/production branch), plus
# manual runs via the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Fail if Firebase secrets aren't configured
        run: |
          if [ -z "${{ secrets.FIREBASE_API_KEY }}" ]; then
            echo "::error::FIREBASE_API_KEY (and the other FIREBASE_* secrets) aren't set. Add your Firebase web config under Settings → Secrets and variables → Actions before this workflow can deploy a working build. See README.md."
            exit 1
          fi

      - run: npm run build
        env:
          # Set these in Settings → Secrets and variables → Actions once you
          # have a real Firebase project (see README.md and .env.example).
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          # Optional — see .env.example. Unset is fine; the "Try the demo"
          # login button just won't show up until these are added.
          VITE_DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          VITE_DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
